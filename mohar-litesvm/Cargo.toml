[package]
name = "mohar-litesvm"
version = "0.1.0"
edition = "2021"

[workspace]

[[test]]
name = "escrow"
path = "tests/escrow.rs"

[dependencies]
litesvm = "0.17"
borsh = "1"
solana-address = { version = "2", features = ["curve25519"] }
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-system-interface = "3"
solana-transaction = { version = "4", features = ["wincode"] }
spl-token = "7"
